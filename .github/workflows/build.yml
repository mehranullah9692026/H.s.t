name: Build
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Arrange files
        run: |
          P=app/src/main
          mkdir -p $P/java/com/healthcare/hospitalapp $P/res/values $P/res/values-ur $P/res/drawable $P/assets
          cp Data.kt MainActivity.kt $P/java/com/healthcare/hospitalapp/
          cp AndroidManifest.xml $P/
          cp ic_launcher.xml $P/res/drawable/
          cp themes.xml $P/res/values/
          cp privacy_policy.html $P/assets/
          cp proguard-rules.pro app/
          cat > $P/res/values/strings.xml <<'E'
          <resources><string name="app_name">HealthCare – Hospital &amp; Medical Services</string></resources>
          E
          cat > $P/res/values-ur/strings.xml <<'E'
          <resources><string name="app_name">ہیلتھ کیئر – ہسپتال اور طبی خدمات</string></resources>
          E
          cat > build.gradle.kts <<'E'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          E
          cat > app/build.gradle.kts <<'E'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.healthcare.hospitalapp"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.healthcare.hospitalapp"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.10.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-core")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.core:core-ktx:1.13.1")
          }
          E
      - name: Build
        run: gradle assembleDebug bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: aab
          path: app/build/outputs/bundle/release/*.aab
